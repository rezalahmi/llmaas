# docker\nginx.conf
events {}

http {
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    upstream api {
        server api:8000;
    }

    server {
        listen 80;
        # پیشنهاد می‌شود نام دامنه را اینجا مشخص کنید
        server_name hooshebarin.ir www.hooshebarin.ir;

        location /health {
            proxy_pass http://api;
        }

        # این بخش برای دسترسی از طریق /llmaas اضافه شده است
        location /llmaas/ {
            limit_req zone=api burst=40;

            # اسلش انتهای آدرس زیر باعث می‌شود /llmaas از URL حذف شده و درخواست به / در اپلیکیشن برسد
            proxy_pass http://api/; 
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 300s;
        }

        # تنظیمات قبلی شما برای مسیر اصلی (اختیاری)
        location / {
            limit_req zone=api burst=40;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
        }
    }
}
