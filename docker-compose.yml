# docker-compose.yml
version: "3.9"

services:

  redis:
    image: redis:7
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5


  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      OLLAMA_URL: http://host.docker.internal:11434/api/generate
      OLLAMA_TOOLS_URL: http://host.docker.internal:11434/api/chat
      EMBEDDING_URL: http://host.docker.internal:9000/embed
      EMBEDDING_URL_BATCH: http://host.docker.internal:9000/embed_batch
      RERANKER_URL: http://host.docker.internal:9100/rerank
      DATABASE_URL: postgresql://appuser:apppass@postgres:5432/appdb
      CHROMA_PATH: /data/chroma
    volumes:
      - chroma_data:/data/chroma
      - ./storage:/app/storage
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      OLLAMA_URL: http://host.docker.internal:11434/api/generate
      OLLAMA_TOOLS_URL: http://host.docker.internal:11434/api/chat
      EMBEDDING_URL: http://host.docker.internal:9000/embed
      EMBEDDING_URL_BATCH: http://host.docker.internal:9000/embed_batch
      RERANKER_URL: http://host.docker.internal:9100/rerank
      DATABASE_URL: postgresql://appuser:apppass@postgres:5432/appdb
      CHROMA_PATH: /data/chroma
    volumes:
      - chroma_data:/data/chroma
      - ./storage:/app/storage
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  stream_worker:
    build:
      context: .
      dockerfile: docker/stream.Dockerfile
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://host.docker.internal:11434/api/generate
    extra_hosts:
      - "host.docker.internal:host-gateway"

  usage_sync:
    profiles:
      - jobs
    build:
      context: .
      dockerfile: docker/api.Dockerfile.stage
    command:
      - python
      - -m
      - app.jobs.sync_usage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://appuser:apppass@postgres:5432/appdb
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: DEBUG
      USAGE_SYNC_BATCH_SIZE: "500"
    restart: "no"

volumes:
  redis_data:
  chroma_data:
  postgres_data:
