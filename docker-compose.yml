version: "3.9"

services:

  redis:
    image: redis:7
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      OLLAMA_URL: http://host.docker.internal:11434/api/generate
      OLLAMA_TOOLS_URL: http://host.docker.internal:11434/api/chat
      EMBEDDING_URL: http://host.docker.internal:9000/embed
      CHROMA_PATH: /data/chroma
    volumes:
      - chroma_data:/data/chroma
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      OLLAMA_URL: http://host.docker.internal:11434/api/generate
      OLLAMA_TOOLS_URL: http://host.docker.internal:11434/api/chat
      EMBEDDING_URL: http://host.docker.internal:9000/embed
      CHROMA_PATH: /data/chroma
    volumes:
      - chroma_data:/data/chroma
    extra_hosts:
      - "host.docker.internal:host-gateway"

  stream_worker:
    build:
      context: .
      dockerfile: docker/stream.Dockerfile
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://host.docker.internal:11434/api/chat
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  redis_data:
  chroma_data:
